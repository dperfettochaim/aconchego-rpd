name: Gerar APK do Aconchego
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar e verificar
        run: |
          gradle --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest lintDebug
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      - name: Permissão de aceleração do emulador
        run: sudo chmod 666 /dev/kvm
      - name: Testar no Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p qa
            adb exec-out run-as br.com.aconchego.rpd.v2 cat files/home-v2.png > qa/home.png
            adb exec-out run-as br.com.aconchego.rpd.v2 cat files/settings-dark-v2.png > qa/settings.png
            adb exec-out run-as br.com.aconchego.rpd.v2 cat files/favorites-v2.png > qa/favorites.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aconchego-QA
          path: |
            qa
            app/build/reports/androidTests
            app/build/reports/lint-results-debug.html
          retention-days: 7
      - name: Preparar APK para assinatura local
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Aconchego-APK
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 7

